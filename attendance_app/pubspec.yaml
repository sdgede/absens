name: attendance_app
description: "Attendance App - Face Recognition Based Attendance System."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Security
  local_auth: ^2.1.6

  # Auth & Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  flutter_dotenv: ^5.1.0

  # Face Recognition (On-Device)
  tflite_flutter: ^0.10.4
  google_mlkit_face_detection: ^0.9.0
  camera: ^0.10.5
  image: ^4.1.0

  # Location
  geolocator: ^11.0.0
  permission_handler: ^11.0.0

  # Notification
  firebase_messaging: ^14.7.0
  flutter_local_notifications: ^16.3.0

  # UI & Charts
  fl_chart: ^0.66.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7

  # Export
  pdf: ^3.10.0
  share_plus: ^7.2.1

  # Navigation
  go_router: ^13.0.0

  # Utils
  intl: ^0.19.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/models/
    - assets/certificates/

